<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Umbra</title>
  <desc>An eclipse: a black disc with a pale cyan corona on its rim.</desc>

  <!--
    The canonical artwork. tools/make-logo.cs renders umbra.ico from these same numbers at nine
    sizes rather than downscaling this, because 2.05% of 16 px is a third of a pixel and a
    resampled ring is a grey smudge. Change a number here and re-run that.

    The disc is opaque black and load-bearing. It is what keeps the inside of the ring dark on a
    light background; without it a pale Explorer window fills the middle and the eclipse becomes
    a cyan donut on white. The ring sits ON the disc's rim rather than floating inside a larger
    disc, which is both what an eclipse looks like and what stops the mark reading as two
    concentric circles.
  -->

  <defs>
    <filter id="corona" x="-40%" y="-40%" width="180%" height="180%"
            filterUnits="objectBoundingBox" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5.1" />
    </filter>
  </defs>

  <circle cx="128" cy="128" r="99.84" fill="#000000" />

  <g fill="none" stroke="#B0F7FB">
    <circle cx="128" cy="128" r="99.84" stroke-width="7.4" opacity="0.5" filter="url(#corona)" />
    <circle cx="128" cy="128" r="99.84" stroke-width="5.25" />
  </g>
</svg>
